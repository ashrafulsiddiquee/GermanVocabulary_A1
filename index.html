<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deutsch A1 Vokabeln</title>
<style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#1d2433;--mut:#6b7280;--line:#e2dccd;--acc:#c8382b;--acc2:#1f4e8c;--der:#2563b8;--die:#c2410c;--das:#2f7d4f;--ok:#2f7d4f;--no:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c212b;--ink:#ece8df;--mut:#9aa3b2;--line:#2c3340;--acc:#ef6a5c;--acc2:#7fb0ee;--der:#7fb0ee;--die:#f19a6b;--das:#7fcf9a;--ok:#7fcf9a;--no:#f0b35c}}
*{box-sizing:border-box}html,body{margin:0}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font:700 18px Georgia,serif;margin:0;cursor:pointer}header h1 span{color:var(--acc)}
nav{margin-left:auto;display:flex;gap:6px}
button,select,input{font:inherit;color:inherit}
.tab{background:none;border:1px solid var(--line);padding:6px 14px;border-radius:20px;cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:22px 16px 40px}
.hero{text-align:center;padding:30px 0 10px}.hero h2{font:700 34px Georgia,serif;margin:0 0 6px}.hero p{color:var(--mut);margin:0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:28px}
.choice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;text-align:left;cursor:pointer;transition:.15s}
.choice:hover{transform:translateY(-3px);border-color:var(--acc)}
.choice b{display:block;font:700 22px Georgia,serif;margin-bottom:6px}.choice span{color:var(--mut)}
.choice i{font-style:normal;font-size:30px;display:block;margin-bottom:8px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.bar select,.bar input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.bar input[type=search]{flex:1;min-width:160px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.on{background:var(--ink);color:var(--bg)}
.meta{color:var(--mut);font-size:14px}
.prog{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 18px}.prog div{height:100%;background:var(--acc);width:0;transition:.2s}
.scene{perspective:1200px;max-width:560px;margin:0 auto}
.card{position:relative;height:320px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.face.back{transform:rotateY(180deg)}
.big{font:700 34px Georgia,serif;word-break:break-word}.sub{color:var(--mut);margin-top:8px}
.hint{position:absolute;bottom:12px;font-size:12px;color:var(--mut)}
.ex{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);width:100%}.ex em{display:block;font-style:normal;font-weight:600}.ex small{color:var(--mut)}
.art-der{color:var(--der)}.art-die{color:var(--die)}.art-das{color:var(--das)}
.ctl{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.ctl .btn{min-width:110px}.know{border-color:var(--ok)!important;color:var(--ok)}.learn{border-color:var(--no)!important;color:var(--no)}
.spk{border:none;background:none;cursor:pointer;font-size:18px;padding:2px 6px;color:var(--mut)}.spk:hover{color:var(--acc)}
.layout{display:grid;grid-template-columns:210px 1fr;gap:22px}
.side{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 40px);overflow:auto;border-right:1px solid var(--line);padding-right:10px}
.side button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:14px}
.side button:hover{background:var(--line)}.side button.on{background:var(--ink);color:var(--bg)}.side small{opacity:.6}
.list h2{font:700 24px Georgia,serif;margin:0 0 2px}
.row{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}
.row .de{font-weight:700;font-size:17px}.row .en{color:var(--mut)}
.row .s{grid-column:1/-1;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}.row .s small{color:var(--mut);display:block}
.opts{display:grid;gap:10px;max-width:560px;margin:20px auto 0}
.opt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;font-size:16px}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}.opt.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,var(--card))}
.qbox{max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.badge{background:var(--no);color:#fff;border-radius:12px;padding:1px 9px;font-size:13px;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px}
footer{text-align:center;color:var(--mut);font-size:16px;width:calc(100% - 40px);max-width:900px;margin:0 auto;padding:26px 0 36px;border-top:1px solid var(--line)}
@media(max-width:720px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none;border:0;display:flex;gap:6px;overflow-x:auto;padding:0 0 8px}.side button{width:auto;white-space:nowrap;border:1px solid var(--line)}.row{grid-template-columns:1fr}.card{height:300px}.big{font-size:28px}}
</style></head><body>

const TITLES=["Classroom words","Guten Tag. Mein Name ist …","Meine Familie","Einkaufen","Wohnung","Mein Tag","Freizeit","Kinder und Schule","Beruf und Arbeit","Ämter und Behörden","Gesundheit und Krankheit","In der Stadt unterwegs","Kundenservice","Neue Kleider","Feste"];
const LES=TITLES.map((t,i)=>({i,t:i?`Lektion ${i}: ${t}`:`Meine Wörter im Kurs`,w:DATA[i]}));
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store={};try{store=JSON.parse(localStorage.getItem('a1vocab')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('a1vocab',JSON.stringify(store))}catch(e){}};
store.known=store.known||{};store.miss=store.miss||{};
const key=(l,w)=>l+'|'+w.de;
const ALL=LES.flatMap(l=>l.w.map(w=>({...w,l:l.i})));
const miss=w=>store.miss[key(w.l,w)]||0;
const hardList=()=>ALL.filter(miss).sort((a,b)=>miss(b)-miss(a));
const addMiss=w=>{const k=key(w.l,w);store.miss[k]=(store.miss[k]||0)+1;save()};
const dec=w=>{const k=key(w.l,w);if(store.miss[k]){store.miss[k]--;if(!store.miss[k])delete store.miss[k]}};
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const art=de=>{const m=/^(der|die|das)\b/i.exec(de);return m?'art-'+m[1].toLowerCase():''};
const colorDe=de=>{const m=/^(der|die|das)\b(.*)$/i.exec(de);return m?`<span class="${art(de)}">${esc(m[1])}</span>${esc(m[2])}`:esc(de)};
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)|, ?-?¨?-?\w*$/g,''));u.lang='de-DE';u.rate=.9;speechSynthesis.speak(u)}

let F={sel:'all',dir:'de',deck:[],i:0,flip:false,only:false};
function build(){let ws=ALL.filter(w=>F.sel==='all'||(F.sel==='hard'?miss(w):+F.sel===w.l));
 if(F.only)ws=ws.filter(w=>!store.known[key(w.l,w)]);F.deck=ws;F.i=0;F.flip=false}
function shuffle(){for(let i=F.deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[F.deck[i],F.deck[j]]=[F.deck[j],F.deck[i]]}F.i=0;F.flip=false;draw()}
function cards(){build();app.innerHTML=`<div class="bar"><select id="ls"><option value="all">All lessons</option><option value="hard">🔥 Hardest words</option>${LES.map(l=>`<option value="${l.i}">${esc(l.t)}</option>`).join('')}</select>
<button class="btn" id="dir"></button><button class="btn" id="sh">🔀 Shuffle</button><button class="btn" id="on"></button><button class="btn" id="rs">Reset progress</button></div>
<div class="meta" id="mt"></div><div class="prog"><div id="pg"></div></div><div id="stage"></div>`;
 $('#ls').value=F.sel;$('#ls').onchange=e=>{F.sel=e.target.value;build();draw()};
 $('#dir').onclick=()=>{F.dir=F.dir==='de'?'en':'de';F.flip=false;draw()};
 $('#sh').onclick=shuffle;$('#on').onclick=()=>{F.only=!F.only;build();draw()};

function draw(){const st=$('#stage');if(!st)return;
 $('#dir').textContent=F.dir==='de'?'Deutsch → English':'English → Deutsch';
 $('#on').textContent=F.only?'Showing: still learning':'Showing: all';$('#on').classList.toggle('on',F.only);
 const kn=Object.keys(store.known).length;
 if(!F.deck.length){st.innerHTML='<div class="empty">🎉 Nothing left in this deck. Switch to “all” to review again.</div>';$('#mt').textContent='';$('#pg').style.width='100%';return}
 const w=F.deck[F.i],k=key(w.l,w);
 $('#mt').textContent=`Card ${F.i+1} of ${F.deck.length} · ${esc(LES[w.l].t)} · ${kn} known overall`;
 $('#pg').style.width=((F.i+1)/F.deck.length*100)+'%';
 const front=F.dir==='de'?`<div class="big">${colorDe(w.de)}</div>`:`<div class="big">${esc(w.en)}</div>`;
 const back=F.dir==='de'?`<div class="big" style="font-size:26px">${esc(w.en)}</div>`:`<div class="big">${colorDe(w.de)}</div>`;
 st.innerHTML=`<div class="scene"><div class="card ${F.flip?'flip':''}" id="cd">
 <div class="face">${front}${F.dir==='de'?'<button class="spk" id="sp1" title="Listen">🔊</button>':''}<div class="hint">click or press Space to flip</div></div>
 <div class="face back">${back}${F.dir==='en'?'<button class="spk" id="sp2" title="Listen">🔊</button>':''}<div class="ex"><em>${esc(w.ex)} <button class="spk" id="sp3" title="Listen">🔊</button></em><small>${esc(w.exen)}</small></div></div></div></div>
 <div class="ctl"><button class="btn" id="pv">← Back</button><button class="btn learn" id="ln">Still learning</button><button class="btn know" id="kw">${store.known[k]?'✓ Known':'I know it'}</button><button class="btn" id="nx">Next →</button></div>`;
 $('#cd').onclick=e=>{if(e.target.closest('.spk'))return;F.flip=!F.flip;$('#cd').classList.toggle('flip',F.flip)};
 [['sp1',w.de],['sp2',w.de],['sp3',w.ex]].forEach(([id,t])=>{const b=$('#'+id);if(b)b.onclick=e=>{e.stopPropagation();speak(t)}});
 const go=d=>{F.i=(F.i+d+F.deck.length)%F.deck.length;F.flip=false;draw()};
 $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
 $('#kw').onclick=()=>{store.known[k]=1;dec(w);save();F.only?(build(),F.i=Math.min(F.i,F.deck.length-1),draw()):go(1)};
 $('#ln').onclick=()=>{delete store.known[k];addMiss(w);go(1)}}

let L={cur:0,q:''};
function list(){app.innerHTML=`<div class="layout"><div class="side" id="sd">${LES.map(l=>`<button data-i="${l.i}">${esc(l.t)} <small>(${l.w.length})</small></button>`).join('')}</div>
<div class="list"><div class="bar"><input type="search" id="q" placeholder="Search German or English (all lessons)…" value="${esc(L.q)}"></div><div id="out"></div></div></div>`;
 $('#sd').onclick=e=>{const b=e.target.closest('button');if(b){L.cur=+b.dataset.i;L.q='';$('#q').value='';show()}};
 $('#q').oninput=e=>{L.q=e.target.value;show()};show()}
function show(){document.querySelectorAll('#sd button').forEach(b=>b.classList.toggle('on',!L.q&&+b.dataset.i===L.cur));
 const q=L.q.trim().toLowerCase();let ws,title;
 if(q){ws=[];LES.forEach(l=>l.w.forEach(w=>{if((w.de+' '+w.en+' '+w.ex).toLowerCase().includes(q))ws.push(w)}));title=`Search results`}
 else{ws=LES[L.cur].w;title=LES[L.cur].t}
 $('#out').innerHTML=`<h2>${esc(title)}</h2><div class="meta" style="margin-bottom:12px">${ws.length} words</div>`+
 (ws.length?ws.map(w=>`<div class="row"><div class="de">${colorDe(w.de)} <button class="spk" data-t="${esc(w.de)}" title="Listen">🔊</button></div><div class="en">${esc(w.en)}</div>
 <div class="s">${esc(w.ex)} <button class="spk" data-t="${esc(w.ex)}" title="Listen">🔊</button><small>${esc(w.exen)}</small></div></div>`).join(''):'<div class="empty">No matches.</div>');
 $('#out').onclick=e=>{const b=e.target.closest('.spk');if(b)speak(b.dataset.t)}}
/* ---------- Quiz ---------- */
let Q={sel:'all',dir:'de',n:'10',qs:[],i:0,score:0,wrong:[],ans:false};
function startQuiz(list){let p=list||shuf((Q.sel==='hard'?hardList():Q.sel==='all'?ALL:ALL.filter(w=>w.l===+Q.sel)).slice());
 if(!list)p=p.slice(0,Q.n==='all'?p.length:+Q.n);
 Q.qs=p.map(w=>{let o=ALL.filter(x=>x!==w&&x.l===w.l&&x.en!==w.en&&x.de!==w.de);if(o.length<3)o=ALL.filter(x=>x!==w&&x.en!==w.en&&x.de!==w.de);
  return{w,opts:shuf([w,...shuf(o).slice(0,3)])}});Q.i=0;Q.score=0;Q.wrong=[];Q.ans=false;quiz()}
function quiz(){app.innerHTML=`<div class="bar"><select id="qs1"><option value="all">All lessons</option><option value="hard">🔥 Hardest words</option>${LES.map(l=>`<option value="${l.i}">${esc(l.t)}</option>`).join('')}</select>
<button class="btn" id="qd">${Q.dir==='de'?'Deutsch → English':'English → Deutsch'}</button>
<select id="qn">${['10','20','all'].map(n=>`<option value="${n}">${n==='all'?'All words':n+' questions'}</option>`).join('')}</select><button class="btn pri" id="go">Start new quiz</button></div><div id="qa"></div>`;
 $('#qs1').value=Q.sel;$('#qn').value=Q.n;
 $('#qs1').onchange=e=>Q.sel=e.target.value;$('#qn').onchange=e=>Q.n=e.target.value;
 $('#qd').onclick=()=>{Q.dir=Q.dir==='de'?'en':'de';$('#qd').textContent=Q.dir==='de'?'Deutsch → English':'English → Deutsch'};
 $('#go').onclick=()=>{if((Q.sel==='hard'&&!hardList().length)){$('#qa').innerHTML='<div class="empty">No hard words yet. Miss a few in a quiz or tap “Still learning” on flashcards.</div>';return}startQuiz()};
 drawQ()}
function drawQ(){const qa=$('#qa');if(!qa)return;
 if(!Q.qs.length){qa.innerHTML='<div class="empty">Choose a lesson and press <b>Start new quiz</b>.</div>';return}
 if(Q.i>=Q.qs.length){const pc=Math.round(Q.score/Q.qs.length*100);
  qa.innerHTML=`<div class="qbox"><div class="big">${Q.score} / ${Q.qs.length}</div><div class="sub">${pc}% ${pc>=80?'· Sehr gut! 🎉':pc>=50?'· Weiter so!':'· Keep practising'}</div>
  ${Q.wrong.length?`<div style="text-align:left;margin-top:18px"><b>To review:</b>${Q.wrong.map(w=>`<div class="meta">${colorDe(w.de)} — ${esc(w.en)}</div>`).join('')}</div>`:''}
  <div class="ctl">${Q.wrong.length?'<button class="btn pri" id="rt">Retry missed</button>':''}<button class="btn" id="nw">New quiz</button></div></div>`;
  if($('#rt'))$('#rt').onclick=()=>startQuiz(Q.wrong.slice());$('#nw').onclick=()=>startQuiz();return}
 const {w,opts}=Q.qs[Q.i],de=Q.dir==='de';Q.ans=false;
 qa.innerHTML=`<div class="meta" style="text-align:center">Question ${Q.i+1} of ${Q.qs.length} · Score ${Q.score}</div><div class="prog"><div style="width:${Q.i/Q.qs.length*100}%"></div></div>
 <div class="qbox"><div class="big">${de?colorDe(w.de):esc(w.en)}${de?' <button class="spk" id="qsp">🔊</button>':''}</div><div class="sub">${de?'What does it mean?':'How do you say it in German?'}</div>
 <div class="opts" id="qo">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${i+1}. ${de?esc(o.en):colorDe(o.de)}</button>`).join('')}</div><div id="fb"></div></div>`;
 if($('#qsp'))$('#qsp').onclick=()=>speak(w.de);
 $('#qo').onclick=e=>{const b=e.target.closest('.opt');if(!b||Q.ans)return;pick(+b.dataset.i)}}
function pick(i){const {w,opts}=Q.qs[Q.i];if(Q.ans)return;Q.ans=true;const good=opts[i]===w;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(opts[j]===w)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
 if(good){Q.score++;dec(w)}else{Q.wrong.push(w);addMiss(w)}save();
 $('#fb').innerHTML=`<div class="ex"><em>${good?'✓ Richtig!':'✗ Not quite: '+colorDe(w.de)+' = '+esc(w.en)}</em>${esc(w.ex)} <button class="spk" id="fsp">🔊</button><br><small>${esc(w.exen)}</small></div><div class="ctl"><button class="btn pri" id="qx">${Q.i+1>=Q.qs.length?'See results':'Next →'}</button></div>`;
 $('#fsp').onclick=()=>speak(w.ex);$('#qx').onclick=()=>{Q.i++;drawQ()}}
document.addEventListener('keydown',e=>{if(!$('#qo'))return;if(/^[1-4]$/.test(e.key)&&!Q.ans)pick(+e.key-1);else if((e.key==='Enter'||e.code==='Space')&&Q.ans&&$('#qx')){e.preventDefault();$('#qx').click()}});
/* ---------- Hardest words ---------- */
function hard(){const hl=hardList();
 app.innerHTML=`<div class="list"><h2>🔥 Hardest words</h2><div class="meta" style="margin-bottom:12px">Words you missed in quizzes or marked “Still learning”. Getting one right (or “I know it”) lowers its count.</div>
 ${hl.length?`<div class="bar"><button class="btn pri" id="hf">Drill as flashcards</button><button class="btn pri" id="hq">Drill as quiz</button><button class="btn" id="hc">Clear list</button></div>
 ${hl.map(w=>`<div class="row"><div class="de">${colorDe(w.de)} <button class="spk" data-t="${esc(w.de)}">🔊</button> <span class="badge">${miss(w)}×</span></div><div class="en">${esc(w.en)}</div><div class="s">${esc(w.ex)}<small>${esc(w.exen)}</small></div></div>`).join('')}`
 :'<div class="empty">Nothing here yet 🎉<br>Take a quiz or use “Still learning” on flashcards and your trouble words will collect here.</div>'}</div>`;
 if(hl.length){$('#hf').onclick=()=>{F.sel='hard';nav('cards')};$('#hq').onclick=()=>{Q.sel='hard';Q.qs=[];nav('quiz');$('#go').click()};
  $('#hc').onclick=()=>{if(confirm('Clear the hardest-words list?')){store.miss={};save();hard()}}}
 app.onclick=e=>{const b=e.target.closest('.spk');if(b)speak(b.dataset.t)}}
const h=location.hash.slice(1);['cards','list','quiz','hard'].includes(h)?nav(h):home();
</script></body></html>
